[project]
name = "happiness-predictor"
version = "1.0.0"
description = "Предсказание индекса счастья (Life Ladder) по экономическим и социальным показателям"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "scikit-learn==1.6.1",          
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "pydantic>=2.4.0",
    "click>=8.1.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
happiness = "happiness.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happiness"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]